name: Flutter checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.5'
          channel: stable
          cache: true
      - run: cp lib/core/config/maps_key.example.dart lib/core/config/maps_key.local.dart
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - name: Build Android debug for ARM64
        run: flutter build apk --debug --no-pub --target-platform android-arm64 --dart-define-from-file=config/local.json
  ios-simulator:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.5'
          channel: stable
          cache: true
      - run: cp lib/core/config/maps_key.example.dart lib/core/config/maps_key.local.dart
      - run: flutter pub get --enforce-lockfile
      - run: flutter build ios --simulator --debug --no-codesign --dart-define-from-file=config/local.json
