name: Flutter checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan reachable Git history for secrets
        shell: bash
        run: |
          set -euo pipefail
          scanner="$RUNNER_TEMP/momiq-gitleaks"
          mkdir -p "$scanner"
          curl --fail --silent --show-error --connect-timeout 10 --max-time 60 --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$scanner/release.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$scanner/release.tar.gz" | sha256sum --check -
          tar -xzf "$scanner/release.tar.gz" -C "$scanner" gitleaks
          printf '[extend]\nuseDefault = true\n' > "$scanner/config.toml"
          touch "$scanner/empty-ignore"
          "$scanner/gitleaks" git . --log-opts=--all --config "$scanner/config.toml" --gitleaks-ignore-path "$scanner/empty-ignore" --ignore-gitleaks-allow --redact=100 --no-banner --timeout 120
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.5'
          channel: stable
          cache: true
      - run: cp lib/core/config/maps_key.example.dart lib/core/config/maps_key.local.dart
      - run: flutter pub get --enforce-lockfile
      - name: Audit public Pub dependency versions
        run: |
          python3 -m unittest discover -s tool -p test_audit_pub.py -q
          flutter pub deps --json > pub-deps.json
          python3 tool/audit_pub.py pub-deps.json --output pub-audit.json
      - run: flutter analyze
      - run: flutter test
      - name: Build Android debug for ARM64
        run: flutter build apk --debug --no-pub --target-platform android-arm64 --dart-define-from-file=config/local.json
  ios-simulator:
    # ARM64 hosted capacity failed before checkout on 2026-10-28.
    # Keep an explicit supported macOS host; real-device ARM64 QA remains required.
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.5'
          channel: stable
          cache: true
      - run: cp lib/core/config/maps_key.example.dart lib/core/config/maps_key.local.dart
      - run: flutter pub get --enforce-lockfile
      - run: flutter build ios --simulator --debug --no-codesign --dart-define-from-file=config/local.json
